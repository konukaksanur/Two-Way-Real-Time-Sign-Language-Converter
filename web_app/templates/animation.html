<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sign Language Animation</title>
  <style>
    :root {
      --primary-color: #003f69;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --border-radius: 12px;
      --text-color: #333;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
    }

    .navigation {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .nav-button {
      padding: 10px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 14px;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease;
    }

    .nav-button:hover {
      background-color: #A1BBD8;
    }

    h2 {
      font-size: 24px;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    form {
      margin-bottom: 30px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    input[type="text"] {
      padding: 12px 16px;
      font-size: 16px;
      width: 320px;
      border: 1px solid #ccc;
      border-radius: var(--border-radius);
      background-color: var(--card-bg);
      box-shadow: var(--shadow);
    }

    button {
      padding: 12px 24px;
      background-color: var(--primary-color);
      color: white;
      font-size: 16px;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #A1BBD8;
    }

    video {
      margin-top: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      border: none;
      background-color: black;
    }
  </style>
</head>
<body>
  <div class="navigation">
    <button class="nav-button" onclick="goHome()">← Ana Sayfa</button>
  </div>

  <h2>Çeviri yapılacak kelimeler:</h2>

  <form id="videoForm">
    <input type="text" id="sentenceInput" placeholder="anne açıklamak ad" required>
    <button type="submit">Oynat</button>
  </form>

  <video id="videoPlayer" width="640" height="360" controls></video>

  <script>
    const form = document.getElementById("videoForm");
    const video = document.getElementById("videoPlayer");

    async function goHome() {
      // Kamerayı durdur
      try {
        await fetch('/stop_camera', { method: 'POST' });
      } catch (err) {
        console.log('Kamera zaten durdurulmuş veya hata:', err);
      }
      
      // Video oynatımını durdur
      if (video) {
        video.pause();
        video.src = '';
      }
      
      // Ana sayfaya git
      window.location.href = '/';
    }

    // Sayfa yüklendiğinde kamerayı durdur
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await fetch('/stop_camera', { method: 'POST' });
      } catch (err) {
        console.log('Kamera zaten durdurulmuş veya hata:', err);
      }
    });

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      const input = document.getElementById("sentenceInput").value.trim();

      if (input === "") {
        alert("Animasyonları olacak kelimeleri giriniz.");
        return;
      }

      const words = input.split(" ");
      const videoQueue = [];
      const missingWords = [];

      for (const word of words) {
        const videoPath = `/static/animations/${word}.mp4`;
        try {
          const response = await fetch(videoPath, { method: 'HEAD' });
          if (response.ok) {
            videoQueue.push(videoPath);
          } else {
            missingWords.push(word);
          }
        } catch (error) {
          missingWords.push(word);
        }
      }

      if (videoQueue.length === 0) {
        alert("" +
            "Hiçbir kelime animasyonu mevcut değil.");
        return;
      }

      let index = 0;
      let alertShown = false;

      function playNextVideo() {
        if (index < videoQueue.length) {
          video.src = videoQueue[index];
          video.load();
          video.play();
          index++;
        } else if (!alertShown && missingWords.length > 0) {
          alertShown = true;
          alert("Animasyonu bulunmayan kelimeler: " + missingWords.join(", "));
        }
      }

      video.removeEventListener("ended", playNextVideo);
      video.addEventListener("ended", playNextVideo);
      playNextVideo();
    });

    // Sayfa kapanırken video durdur
    window.addEventListener('beforeunload', () => {
      if (video) {
        video.pause();
        video.src = '';
      }
    });
  </script>

</body>
</html>
