<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sign Language Animation</title>
  <style>
    :root {
      --primary-color: #003f69;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --border-radius: 12px;
      --text-color: #333;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
    }

    h2 {
      font-size: 24px;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    form {
      margin-bottom: 30px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    input[type="text"] {
      padding: 12px 16px;
      font-size: 16px;
      width: 320px;
      border: 1px solid #ccc;
      border-radius: var(--border-radius);
      background-color: var(--card-bg);
      box-shadow: var(--shadow);
    }

    button {
      padding: 12px 24px;
      background-color: var(--primary-color);
      color: white;
      font-size: 16px;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #A1BBD8;
    }

    video {
      margin-top: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      border: none;
      background-color: black;
    }
  </style>
</head>
<body>

  <h2>Enter a sentence:</h2>

  <form id="videoForm">
    <input type="text" id="sentenceInput" placeholder="anne açıklamak ad" required>
    <button type="submit">Oynat</button>
  </form>

  <video id="videoPlayer" width="640" height="360" controls></video>

  <script>
    const form = document.getElementById("videoForm");
    const video = document.getElementById("videoPlayer");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      const input = document.getElementById("sentenceInput").value.trim();

      if (input === "") {
        alert("Enter a sentence.");
        return;
      }

      const words = input.split(" ");
      const videoQueue = [];
      const missingWords = [];

      for (const word of words) {
        const videoPath = `/static/${word}.mp4`;
        try {
          const response = await fetch(videoPath, { method: 'HEAD' });
          if (response.ok) {
            videoQueue.push(videoPath);
          } else {
            missingWords.push(word);
          }
        } catch (error) {
          missingWords.push(word);
        }
      }

      if (videoQueue.length === 0) {
        alert("" +
            "None of the words are valid.");
        return;
      }

      let index = 0;
      let alertShown = false;

      function playNextVideo() {
        if (index < videoQueue.length) {
          video.src = videoQueue[index];
          video.load();
          video.play();
          index++;
        } else if (!alertShown && missingWords.length > 0) {
          alertShown = true;
          alert("Invalid words: " + missingWords.join(", "));
        }
      }

      video.removeEventListener("ended", playNextVideo);
      video.addEventListener("ended", playNextVideo);
      playNextVideo();
    });
  </script>

</body>
</html>
