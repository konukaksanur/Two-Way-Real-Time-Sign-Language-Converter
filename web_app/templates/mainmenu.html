<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ana Sayfa</title>
  <style>
    :root {
      --primary-color: #003f69;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-color: #333;
      --border-radius: 12px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      color: var(--primary-color);
      margin-bottom: 40px;
      text-align: center;
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #A1BBD8;
    }
  </style>
</head>
<body>

  <h1>Turkish Sign Language Converter</h1>

  <div class="button-container">
    <button onclick="window.location.href='/SignToText'">Sign To Text</button>
    <button onclick="window.location.href='/TextToSign'">Text To Sign</button>
  </div>

</body>
</html>
