<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Language Recognition</title>
  <style>
    :root {
      --primary-color: #003f69;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --border-radius: 12px;
      --text-color: #333;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      color: var(--text-color);
    }

    #video-container {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 2px solid #d1dce5;
    }

    #video-container h2 {
      background-color: var(--primary-color);
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 20px;
    }

    #predictions-container {
      max-width: 400px;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid #e0e6ed;
    }

    #predictions-container h2 {
      font-size: 20px;
      color: var(--primary-color);
      margin-bottom: 12px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 8px;
    }

    #predictions {
      font-size: 22px;
      color: #222;
      margin-top: 20px;
      line-height: 1.6;
      word-break: break-word;
      min-height: 100px;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <h2>Live Camera</h2>
    <img src="{{ url_for('video_feed') }}" width="640" height="480" alt="Camera Feed">
  </div>

  <div id="predictions-container">
    <h2>Predicted Signs</h2>
    <div id="predictions">Waiting for prediction...</div>
  </div>

  <script>
    async function fetchPredictions() {
      try {
        const res = await fetch("/get_predictions");
        const data = await res.json();
        document.getElementById("predictions").innerText = data.sentence.join(" ");
      } catch (err) {
        console.error("Prediction fetch error:", err);
        document.getElementById("predictions").innerText = "Connection error.";
      }
    }
    setInterval(fetchPredictions, 1000);
  </script>
</body>
</html>
