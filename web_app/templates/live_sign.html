<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Language Recognition</title>
  
  <!-- Önbellekleme engelleme için meta tag -->
  <meta http-equiv="Cache-Control" content="no-store" />
  
  <style>
    :root {
      --primary-color: #003f69;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --border-radius: 12px;
      --text-color: #333;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      color: var(--text-color);
    }

    #video-container {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 2px solid #d1dce5;
      position: relative;
    }

    #video-container h2 {
      background-color: var(--primary-color);
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 20px;
    }

    #predictions-container {
      max-width: 400px;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid #e0e6ed;
    }

    #predictions-container h2 {
      font-size: 20px;
      color: var(--primary-color);
      margin-bottom: 12px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 8px;
    }

    #predictions {
      font-size: 22px;
      color: #222;
      margin-top: 20px;
      line-height: 1.6;
      word-break: break-word;
      min-height: 100px;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .navigation {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .nav-button {
      padding: 10px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 14px;
      box-shadow: var(--shadow);
      transition: background-color 0.2s ease;
    }

    .nav-button:hover {
      background-color: #A1BBD8;
    }
  </style>
</head>
<body>
  <div class="navigation">
    <button class="nav-button" onclick="goHome()">← Ana Sayfa</button>
  </div>

  <div id="video-container">
    <h2>Live Camera</h2>
    <img id="cameraFeed" src="http://127.0.0.1:5001/video_feed" width="640" height="480" alt="Camera Feed">
  </div>

  <div id="predictions-container">
    <h2>Predicted Signs</h2>
    <div id="predictions">Waiting for prediction...</div>
  </div>

  <script>
    let predictionInterval;

    async function fetchPredictions() {
      try {
        const res = await fetch("/get_predictions");
        const data = await res.json();
        document.getElementById("predictions").innerText = data.sentence.join(" ");
      } catch (err) {
        console.error("Prediction fetch error:", err);
        document.getElementById("predictions").innerText = "Connection error.";
      }
    }

    function startPredictions() {
      predictionInterval = setInterval(fetchPredictions, 1000);
    }

    function stopPredictions() {
      if (predictionInterval) {
        clearInterval(predictionInterval);
        predictionInterval = null;
      }
    }

    async function stopCamera() {
      try {
        await fetch('/stop_camera', { method: 'POST' });
        console.log('Kamera durduruldu');
      } catch (err) {
        console.error('Kamera durdurma hatası:', err);
      }
    }

    function goHome() {
      stopPredictions();
      stopCamera();
      
      // Kamera akışını durdur
      const img = document.getElementById('cameraFeed');
      if (img) {
        img.src = '';
      }
      
      // Kısa bir bekleme sonrası yönlendir
      setTimeout(() => {
        window.location.href = '/';
      }, 100);
    }

    // Sayfa kapanırken veya yenilenirken kamera akışını durdur
    window.addEventListener('beforeunload', () => {
      stopPredictions();
      stopCamera();
      
      const img = document.getElementById('cameraFeed');
      if (img) {
        img.src = '';
      }
    });

    // Sayfa değişikliklerini yakala
    window.addEventListener('pagehide', () => {
      stopPredictions();
      stopCamera();
    });

    // Visibility API ile sayfa gizlendiğinde kamerayı durdur
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPredictions();
        stopCamera();
      } else {
        startPredictions();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      startPredictions();
    });
  </script>
</body>
</html>
