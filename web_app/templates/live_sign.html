<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Language Recognition</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      padding: 40px;
      background-color: #f5f5f5;
    }

    #video-container {
      border: 4px solid #444;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    #video-container h2 {
      margin: 0;
      padding: 10px;
      background-color: #333;
      color: white;
      text-align: center;
    }

    #predictions-container {
      max-width: 400px;
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    #predictions-container h2 {
      margin-top: 0;
      color: #333;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
    }

    #predictions {
      font-size: 24px;
      color: #222;
      margin-top: 20px;
      line-height: 1.6;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <h2>Live Camera</h2>
    <!-- ✅ Dinamik URL: çalışır ve esnek -->
    <img src="{{ url_for('video_feed') }}" width="640" height="480" alt="Camera Feed">
  </div>

  <div id="predictions-container">
    <h2>Predicted Signs</h2>
    <div id="predictions">Waiting for prediction...</div>
  </div>

  <script>
    async function fetchPredictions() {
      try {
        const res = await fetch("/get_predictions");
        const data = await res.json();
        document.getElementById("predictions").innerText = data.sentence.join(" ");
      } catch (err) {
        console.error("Prediction fetch error:", err);
        document.getElementById("predictions").innerText = "Connection error.";
      }
    }
    setInterval(fetchPredictions, 1000);
  </script>
</body>
</html>
